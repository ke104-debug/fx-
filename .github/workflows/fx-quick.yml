name: AI_FX 5分監視
# 5分ごと: 1分足で急変を検知 (時間外でも通知)。下値・上値への接近などチャンスの候補があれば AI の詳しい分析を行い、
# 信頼度が基準以上なら通知 (活動時間内)。普段は何も送らず数十秒で終わる。公開リポジトリのため無料。
on:
  schedule:
    - cron: "3-58/5 * * * 1-5"   # 0分ちょうどの混雑を避けて 3,8,13…分に。GitHub の混雑で遅れたり飛ばされることがあります
    - cron: "3-58/5 20-23 * * 0" # 日曜は市場が開く 20時 (UTC) から。金曜 22時以降・土曜は中で止める (fxpred/market.py)
  workflow_dispatch: {}
permissions:
  contents: write
# 1回起動したら30分間、中で5分ごとに見張り続ける (外の時計役や GitHub の定期実行が抜けても見張りが途切れないように)。
# 実行中にもう1つ起動されたら順番待ち (1つだけ)。毎時の分析とは別の組なので、互いに待たせない
concurrency:
  group: fx-quick
  cancel-in-progress: false
jobs:
  gate:   # 市場が閉まっている間 (金曜 22時〜日曜 20時 UTC) の GitHub の定期実行は、ここで終わる (週末の無駄な実行を止める)
    runs-on: ubuntu-latest
    outputs:
      open: ${{ steps.mk.outputs.open }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: fxpred/market.py, sparse-checkout-cone-mode: false }
      - id: mk
        run: |
          # 手動・時計役 (worker は市場が開いている時と週次だけ押す) の実行はそのまま動かす。GitHub の定期実行だけ市場の時間で止める
          if [ "${{ github.event_name }}" != "schedule" ] || python3 fxpred/market.py; then echo "open=true" >> "$GITHUB_OUTPUT"; else echo "open=false" >> "$GITHUB_OUTPUT"; fi
  quick:
    needs: gate
    if: needs.gate.outputs.open == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: 毎時分析の状態 (下値・上値) を復元
        uses: actions/cache/restore@v4
        with:
          path: state
          key: fx-auto-${{ github.run_id }}
          restore-keys: fx-auto-
      - name: 5分監視の状態を復元
        uses: actions/cache/restore@v4
        with:
          path: state/quick.json
          key: fx-quick-${{ github.run_id }}
          restore-keys: fx-quick-
      - name: 30分間、5分ごとに見張る (毎回、記録を保存)
        run: |
          git config user.name "ai-fx-bot"
          git config user.email "ai-fx-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 28*60 ))
          while :; do
            t0=$(date +%s)
            python -m fxpred.quick || echo "5分監視のエラー (次の回で続ける)"
            bash tools/save.sh "記録を更新 (5分監視) $(date -u +%Y-%m-%dT%H:%MZ)" journal
            [ $(( $(date +%s) + 300 )) -gt $end ] && break
            python3 fxpred/market.py >/dev/null || break   # 市場が閉まっていれば1回で終える (手動で起動した時など)
            w=$(( 300 - ($(date +%s) - t0) )); [ $w -gt 0 ] && sleep $w
          done
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state/quick.json
          key: fx-quick-${{ github.run_id }}
      - name: シグナルの記録を保存 (変更があった時だけ)
        run: |
          git config user.name "ai-fx-bot"
          git config user.email "ai-fx-bot@users.noreply.github.com"
          bash tools/save.sh "記録を更新 (5分監視) $(date -u +%Y-%m-%dT%H:%MZ)" journal
      - name: 失敗したら Discord に知らせる
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = os.environ.get("DISCORD_WEBHOOK_URL")
          if url:
              run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              body = {"embeds": [{"title": "❌ AI_FX: 自動実行が失敗しました", "color": 15548997,
                      "description": f"{os.environ['GITHUB_WORKFLOW']}\n詳細: {run}\nこの間は監視・通知が止まっています。"}]}
              urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(body).encode(),
                      headers={"Content-Type": "application/json", "User-Agent": "fxpred"}), timeout=15)
          PY
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
