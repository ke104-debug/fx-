name: 1分足データの取得 (手動)
# Dukascopy の公開データ (USD/JPY 1分足 2004〜) を、期間を分けて同時に取得し、data-m1 ブランチに年ごとに保存する。
# 研究 (短い足の作戦の検証) 用。公開リポジトリなので GitHub Actions は無料。
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        span: ["2004-01-01:2006-12-31", "2007-01-01:2009-12-31", "2010-01-01:2012-12-31", "2013-01-01:2015-12-31",
               "2016-01-01:2018-12-31", "2019-01-01:2021-06-30", "2021-07-01:2023-12-31", "2024-01-01:2026-12-31"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -q numpy==2.5.3
      - name: 取得
        run: |
          IFS=: read A B <<< "${{ matrix.span }}"
          python tools/duka_m1.py $A $B m1_${A}.npz 15500
      - uses: actions/upload-artifact@v4
        with:
          name: m1-${{ strategy.job-index }}
          path: m1_*.npz
          retention-days: 7
  save:
    needs: download
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: pip install -q numpy==2.5.3
      - uses: actions/download-artifact@v4
        with: {path: parts, merge-multiple: true}
      - name: 年ごとに分けて data-m1 ブランチに保存
        run: |
          git fetch -q origin data-m1 && git archive origin/data-m1 m1 | tar -x || mkdir -p m1
          python3 - <<'PY'
          import glob, os, numpy as np
          os.makedirs("m1", exist_ok=True)
          new = [np.load(f) for f in glob.glob("parts/*.npz")]
          old = [np.load(f) for f in glob.glob("m1/*.npz")]
          cols = "tochl"
          allp = {k: np.concatenate([z[k] for z in old + new]) for k in cols}
          t, idx = np.unique(allp["t"], return_index=True)
          yr = (t // 86400 // 365.2425 + 1970).astype(int)
          for y in np.unique(yr):
              m = yr == y
              np.savez_compressed(f"m1/USDJPY_{y}.npz", **{k: (t if k == "t" else allp[k][idx])[m] for k in cols})
              print(y, int(m.sum()))
          PY
          git config user.name "ai-fx-bot"
          git config user.email "ai-fx-bot@users.noreply.github.com"
          git checkout -q --orphan data-m1-tmp
          git rm -rq --cached . && git add -f m1
          git commit -qm "Dukascopy USD/JPY 1分足 $(ls m1 | wc -l) 年分"
          git push -qf origin data-m1-tmp:data-m1
