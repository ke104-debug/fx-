name: AI_FX 自動運用
# 毎時: 相場の監視 (チャンス・急変の時だけ Discord に通知)
# 毎朝8時 (日本時間): 昨日の振り返り・今日の予想を通知。2時台に夜の復習。記録 (journal/) をリポジトリに保存
on:
  schedule:
    # 毎時0〜5分は世界中の定期実行が集中して遅れ・取りこぼしが多いため、混雑を避けた17分・47分に実行
    - cron: "17,47 * * * 1-5"
    - cron: "17,47 20-23 * * 0"   # 日曜は市場が開く 20時 (UTC) から
    - cron: "17 1 * * 6"     # 土曜 10:17 (日本時間): 週次の見直し (毎月最初の土曜は月次も)
  workflow_dispatch:
    inputs:
      morning:
        description: "朝の予想・振り返りも実行する"
        type: boolean
        default: false
      test:
        description: "テスト通知だけ送る (過去の場面を再現。記録は残さない)"
        type: boolean
        default: false
      status:
        description: "今の相場の分析 (定期報告) を今すぐ送る"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write    # 夜の検証部屋を毎時の分析から起動するため
concurrency: fx-shared
jobs:
  gate:   # 市場が閉まっている間 (金曜 22時〜日曜 20時 UTC) の GitHub の定期実行は、ここで終わる (週末の無駄な実行を止める)
    runs-on: ubuntu-latest
    outputs:
      open: ${{ steps.mk.outputs.open }}
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: fxpred/market.py, sparse-checkout-cone-mode: false }
      - id: mk
        run: |
          # 手動・時計役 (worker は市場が開いている時と週次だけ押す) の実行はそのまま動かす。GitHub の定期実行だけ市場の時間で止める
          if [ "${{ github.event_name }}" != "schedule" ] || python3 fxpred/market.py || [ "$(date -u +%u%H)" = "601" ] || [ "$(date -u +%u%H)" = "602" ]; then echo "open=true" >> "$GITHUB_OUTPUT"; else echo "open=false" >> "$GITHUB_OUTPUT"; fi
  run:
    needs: gate
    if: needs.gate.outputs.open == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt
      - name: 前回の状態と記録を復元
        uses: actions/cache/restore@v4
        with:
          path: state
          key: fx-auto-${{ github.run_id }}
          restore-keys: fx-auto-
      - name: テスト通知
        if: ${{ inputs.test }}
        run: python -m fxpred testnotify
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: 監視 (朝8時台は予想・振り返り、2時台は夜の復習も)
        if: ${{ !inputs.test }}
        run: python -m fxpred auto ${{ inputs.morning && '--morning' || '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          FX_STATUS_NOW: ${{ inputs.status && '1' || '' }}
      - name: 状態と記録を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: fx-auto-${{ github.run_id }}
      - name: 予想・振り返りの記録をリポジトリに保存 (変更があった時だけ)
        run: |
          git config user.name "ai-fx-bot"
          git config user.email "ai-fx-bot@users.noreply.github.com"
          bash tools/save.sh "記録を更新 $(date -u +%Y-%m-%dT%H:%MZ)" journal config/org_weights.json config/cftc_jpy.csv reports/inspector.md
      - name: 失敗したら Discord に知らせる
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = os.environ.get("DISCORD_WEBHOOK_URL")
          if url:
              run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              body = {"embeds": [{"title": "❌ AI_FX: 自動実行が失敗しました", "color": 15548997,
                      "description": f"{os.environ['GITHUB_WORKFLOW']}\n詳細: {run}\nこの間は監視・通知が止まっています。"}]}
              urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(body).encode(),
                      headers={"Content-Type": "application/json", "User-Agent": "fxpred"}), timeout=15)
          PY
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
