name: 20年データの取得 (手動)
# Dukascopy の公開データ (USD/JPY 1時間足 2004〜2024) をゆっくり取得し、data-duka ブランチに保存する。
# 接続制限があるため最大5時間かけて少しずつ。取得済みの月は飛ばすので、何回でも実行して続きから取れる。
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: 取得済みのデータ (data-duka ブランチ) を復元
        run: |
          git fetch -q origin data-duka && git show origin/data-duka --name-only >/dev/null 2>&1 && \
            git archive origin/data-duka data | tar -x || echo "まだ取得済みデータなし"
      - name: 取得 (最大4.5時間)
        run: |
          mkdir -p data/duka; echo "BEFORE=$(ls data/duka | wc -l)" >> $GITHUB_ENV
          timeout 16200 python tools/duka_download.py 2004 2025 || true
      - name: data-duka ブランチに保存
        run: |
          git config user.name "ai-fx-bot"
          git config user.email "ai-fx-bot@users.noreply.github.com"
          git checkout -q --orphan data-duka-tmp
          git rm -rq --cached . && git add -f data/duka
          AFTER=$(ls data/duka | wc -l)
          git commit -qm "Dukascopy USD/JPY 1時間足 ${AFTER} か月分 (+$((AFTER - BEFORE)))"
          git push -qf origin data-duka-tmp:data-duka
          echo "$(ls data/duka | wc -l) files"
      - name: 失敗したら Discord に知らせる
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          url = os.environ.get("DISCORD_WEBHOOK_URL")
          if url:
              run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
              body = {"embeds": [{"title": "❌ AI_FX: 自動実行が失敗しました", "color": 15548997,
                      "description": f"{os.environ['GITHUB_WORKFLOW']}\n詳細: {run}\nこの間は監視・通知が止まっています。"}]}
              urllib.request.urlopen(urllib.request.Request(url, data=json.dumps(body).encode(),
                      headers={"Content-Type": "application/json", "User-Agent": "fxpred"}), timeout=15)
          PY
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
